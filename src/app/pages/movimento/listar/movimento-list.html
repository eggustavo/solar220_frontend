<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template #start>
            <h5 class="m-0">Lançamentos</h5>
        </ng-template>
        <ng-template #end>
            <button pButton (click)="adicionar()"><i class="pi pi-plus"></i>Adicionar</button>
        </ng-template>
    </p-toolbar>
    <p-table [value]="movimentos()" [loading]="loading()" [stripedRows]="true" [rowHover]="true" [paginator]="true" [rows]="10" dataKey="id">
        <ng-template #header>
            <tr>
                <th scope="col" style="width: 40rem">Beneciário</th>
                <th scope="col" style="width: 8rem">Número UC</th>
                <th scope="col" style="width: 8rem; text-align: center">Mês/Ano Referência</th>
                <th scope="col" style="width: 8rem; text-align: center">Faturado?</th>
                <th scope="col" style="width: 8rem; text-align: center">Integrado?</th>
                <th scope="col" style="width: 5rem">Ações</th>
            </tr>
        </ng-template>
        <ng-template #body let-movimento>
            <tr>
                <td>{{ movimento.contrato.beneficiario.nome }}</td>
                <td>{{ movimento.contrato.beneficiarioNumeroUc }}</td>
                <td style="text-align: center">{{ movimento.mesAnoReferencia }}</td>
                <td style="text-align: center">
                    <p-tag [value]="movimento.flagLiberadoFaturamento ? 'Sim' : 'Não'" [severity]="movimento.flagLiberadoFaturamento ? 'success' : 'secondary'" />
                </td>
                <td style="text-align: center">
                    <p-tag [value]="movimento.flagIntegradoFinanceiro ? 'Sim' : 'Não'" [severity]="movimento.flagIntegradoFinanceiro ? 'success' : 'secondary'" />
                </td>
                <td>
                    <button pButton [iconOnly]="true" severity="secondary" [rounded]="true" [text]="true" (click)="abrirMenuAcoes($event, movimento, acoesMenu)" pTooltip="Ações"><i class="pi pi-ellipsis-v"></i></button>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="6" class="text-center">Nenhum lançamento encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
    <p-menu #acoesMenu [popup]="true" [model]="menuItems" appendTo="body" />
</div>

<p-confirmdialog [style]="{ width: '450px' }" />
