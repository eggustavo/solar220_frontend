<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template #start>
            <h5 class="m-0">Lançamentos</h5>
        </ng-template>
        <ng-template #end>
            <button pButton (click)="adicionar()"><i class="pi pi-plus"></i>Adicionar</button>
        </ng-template>
    </p-toolbar>
    <p-table [value]="movimentos()" [loading]="loading()" [stripedRows]="true" [rowHover]="true" [paginator]="true" [rows]="10" dataKey="id">
        <ng-template #header>
            <tr>
                <th scope="col" style="width: 40rem">Beneciário</th>
                <th scope="col" style="width: 8rem">Número UC</th>
                <th scope="col" style="width: 8rem; text-align: center">Mês/Ano Referência</th>
                <th scope="col" style="width: 8rem; text-align: center">Faturado?</th>
                <th scope="col" style="width: 8rem; text-align: center">Integrado?</th>
                <th scope="col" style="width: 12rem"></th>
            </tr>
        </ng-template>
        <ng-template #body let-movimento>
            <tr>
                <td>{{ movimento.participanteBeneficiario.nome }}</td>
                <td>{{ movimento.participanteBeneficiario.numeroUc }}</td>
                <td style="text-align: center">{{ movimento.mesAnoReferencia }}</td>
                <td style="text-align: center">
                    <p-tag [value]="movimento.flagLiberadoFaturamento ? 'Sim' : 'Não'" [severity]="movimento.flagLiberadoFaturamento ? 'success' : 'secondary'" />
                </td>
                <td style="text-align: center">
                    <p-tag [value]="movimento.flagIntegradoFinanceiro ? 'Sim' : 'Não'" [severity]="movimento.flagIntegradoFinanceiro ? 'success' : 'secondary'" />
                </td>
                <td>
                    <button pButton [iconOnly]="true" severity="info" [rounded]="true" [text]="true" (click)="imprimirRelatorioCedente(movimento)" pTooltip="Relatório Cedente"><i class="pi pi-print"></i></button>
                    <button pButton [iconOnly]="true" severity="info" [rounded]="true" [text]="true" (click)="imprimirRelatorioBeneficiario(movimento)" pTooltip="Relatório Beneficiário"><i class="pi pi-file-pdf"></i></button>
                    <button pButton [iconOnly]="true" severity="secondary" [rounded]="true" [text]="true" (click)="editar(movimento)" pTooltip="Editar"><i class="pi pi-pencil"></i></button>
                    <button pButton [iconOnly]="true" severity="danger" [rounded]="true" [text]="true" (click)="excluir(movimento)" pTooltip="Excluir"><i class="pi pi-trash"></i></button>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="6" class="text-center">Nenhum lançamento encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-confirmdialog [style]="{ width: '450px' }" />
